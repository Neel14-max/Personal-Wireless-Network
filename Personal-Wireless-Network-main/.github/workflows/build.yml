name: Build TetherDirect APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk TetherDirect.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TetherDirect-APK
          path: TetherDirect.apk

      # Publishes a public, downloadable APK so anyone can install it without a
      # GitHub login. Keeps a rolling "latest" release updated on every build.
      - name: Publish downloadable release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TetherDirect (latest build)
          body: |
            Latest TetherDirect Android APK.

            Install: download `TetherDirect.apk`, open it on your phone, and allow
            "Install from unknown sources" if prompted. No root required.
          files: TetherDirect.apk
          prerelease: false
